<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Customer feedback</title><style>body{font:16px system-ui;max-width:680px;margin:40px auto;padding:20px;color:#16202B}h1{color:#0E2A47}label,fieldset{display:block;margin:18px 0}input:not([type=radio]),textarea,select{display:block;width:100%;padding:10px;margin-top:6px;box-sizing:border-box}textarea{min-height:100px}button{padding:12px 18px;background:#E2A63B;border:0;font-weight:bold;cursor:pointer}.note{padding:10px;background:#eef7f2}</style></head><body><h1>Customer feedback</h1><p>Tell us how we did today</p><p class="note">Answers stay on this device. Submit to download an answer file that you can send to the form creator.</p><form id="f"><label>Your name<input name="q0" type="text" required></label><label>How was your visit?<input name="q1" type="text" required></label><label>What should we bake next?<input name="q2" type="text" required></label><label>May we contact you?<input name="q3" type="text" required></label><button>Save my answers</button></form><script>document.getElementById("f").onsubmit=function(e){e.preventDefault();var data={form:"Customer feedback",submittedAt:new Date().toISOString(),answers:Object.fromEntries(new FormData(this))},a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="form-answers.json";a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000)}</script></body></html>
