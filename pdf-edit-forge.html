<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Edit Forge — optimize and sign PDFs privately</title><meta name="description" content="Optimize a PDF and add a typed or drawn signature locally in your browser."><link rel="stylesheet" href="local-tools.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script></head><body><nav class="tool-nav"><a href="index.html">← All tools</a><span>PDF Edit Forge</span></nav><header class="masthead"><div><h1>PDF Edit Forge</h1><p>Optimize and sign a PDF without uploading it.</p></div></header><main><section class="panel"><p class="privacy">🔒 Your PDF and signature remain on this device. Keep the original file as a backup.</p><div class="field"><label for="file">PDF file</label><input id="file" type="file" accept="application/pdf"></div><div class="grid"><div class="field"><label for="page">Signature page</label><input id="page" type="number" min="1" value="1"></div><div class="field"><label for="name">Typed signature (optional)</label><input id="name" placeholder="Alex Morgan"></div></div><div class="field"><label>Draw signature (optional)</label><canvas id="sig" width="700" height="180" style="width:100%;height:120px;background:#fff;border:1px solid rgba(22,32,43,.28);touch-action:none"></canvas></div><div class="actions"><button class="secondary" id="clear">Clear signature</button><button class="primary" id="sign">Optimize, sign and download</button></div><div class="status" id="status"></div></section></main><footer>Part of <a href="index.html">MigaBuilder</a>. A visual signature is not the same as a cryptographic digital signature.</footer><script>
const $=id=>document.getElementById(id),c=$('sig'),g=c.getContext('2d');g.lineWidth=5;g.lineCap='round';g.strokeStyle='#13202d';let drawing=false,drawn=false;function pos(e){const r=c.getBoundingClientRect(),p=e.touches?.[0]||e;return[(p.clientX-r.left)*c.width/r.width,(p.clientY-r.top)*c.height/r.height]}function start(e){drawing=true;drawn=true;g.beginPath();g.moveTo(...pos(e));e.preventDefault()}function move(e){if(!drawing)return;g.lineTo(...pos(e));g.stroke();e.preventDefault()}['mousedown','touchstart'].forEach(k=>c.addEventListener(k,start,{passive:false}));['mousemove','touchmove'].forEach(k=>c.addEventListener(k,move,{passive:false}));['mouseup','mouseleave','touchend'].forEach(k=>c.addEventListener(k,()=>drawing=false));$('clear').onclick=()=>{g.clearRect(0,0,c.width,c.height);drawn=false};function note(s){$('status').textContent=s;$('status').classList.add('show')}function dl(bytes){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));a.href=u;a.download='migabuilder-signed-optimized.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
$('sign').onclick=async()=>{const f=$('file').files[0];if(!f)return note('Choose a PDF first.');try{note('Optimizing locally…');const doc=await PDFLib.PDFDocument.load(await f.arrayBuffer()),pages=doc.getPages(),n=Math.max(1,Math.min(pages.length,+$('page').value||1)),p=pages[n-1],{width}=p.getSize(),name=$('name').value.trim();if(drawn){const png=await doc.embedPng(c.toDataURL('image/png'));const dims=png.scale(.22);p.drawImage(png,{x:36,y:36,width:Math.min(dims.width,width*.42),height:dims.height})}else if(name){const font=await doc.embedFont(PDFLib.StandardFonts.HelveticaOblique);p.drawText(name,{x:42,y:46,size:22,font,color:PDFLib.rgb(.08,.12,.18)})}const bytes=await doc.save({useObjectStreams:true,addDefaultPage:false});dl(bytes);const delta=Math.round((1-bytes.length/f.size)*100);note(`Downloaded. ${delta>0?'File reduced by '+delta+'%.':'This PDF was already optimized; the signed copy may be similar in size.'}`)}catch(e){note('Could not process this PDF: '+e.message)}};
</script></body></html>
