<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saturday Morning Romance - 3D Cartoon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    font-family: 'Comic Sans MS', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .cartoon-container {
    position: relative;
    width: 100%;
    max-width: 960px;
    background: #000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    border-radius: 12px;
    overflow: hidden;
  }
  #webglCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
  }
  .overlay-screen {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: opacity 0.3s;
  }
  .overlay-screen.hidden { opacity: 0; pointer-events: none; }
  .start-btn {
    background: #ff3366;
    color: white;
    border: none;
    padding: 16px 40px;
    font-size: 24px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #b3002d;
  }
  .caption-box {
    position: absolute;
    bottom: 60px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    pointer-events: none;
    z-index: 5;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div class="cartoon-container">
  <div id="overlay" class="overlay-screen">
    <button class="start-btn" id="startBtn">▶ PLAY 3D CARTOON</button>
  </div>

  <div id="caption" class="caption-box">OH LA LA! Look who walked into the party!</div>
  <canvas id="webglCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('webglCanvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12021a);

const camera = new THREE.PerspectiveCamera(45, 16 / 9, 0.1, 1000);
camera.position.set(0, 3, 12);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(960, 540);

const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

function createToonMaterial(color) {
  return new THREE.MeshToonMaterial({ color: color });
}

function addOutline(mesh, thickness = 0.04) {
  const outlineMaterial = new THREE.MeshBasicMaterial({
    color: 0x000000,
    side: THREE.BackSide
  });
  const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMaterial);
  outlineMesh.scale.multiplyScalar(1 + thickness);
  mesh.add(outlineMesh);
}

function buildCharacter(bodyColor, headColor) {
  const group = new THREE.Group();

  const headGeo = new THREE.SphereGeometry(0.8, 32, 32);
  const headMat = createToonMaterial(headColor);
  const head = new THREE.Mesh(headGeo, headMat);
  head.position.y = 2.2;
  addOutline(head);
  group.add(head);

  const bodyGeo = new THREE.ConeGeometry(0.9, 2.2, 32);
  const bodyMat = createToonMaterial(bodyColor);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.8;
  addOutline(body);
  group.add(body);

  return group;
}

const roxie = buildCharacter(0xff3366, 0xffcc80);
roxie.position.set(-2.5, 0, 0);
scene.add(roxie);

const lexi = buildCharacter(0x33ccff, 0xffcc80);
lexi.position.set(2.5, 0, 0);
scene.add(lexi);

const brad = buildCharacter(0x3366cc, 0xffe0b2);
brad.position.set(0, 0, -1);
scene.add(brad);

const floorGeo = new THREE.PlaneGeometry(20, 20);
const floorMat = createToonMaterial(0x2b0933);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

let clock = new THREE.Clock();
let isPlaying = false;

document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  isPlaying = true;
  clock.start();
});

function animate() {
  requestAnimationFrame(animate);

  if (isPlaying) {
    const t = clock.getElapsedTime();

    roxie.position.y = Math.sin(t * 4) * 0.15;
    roxie.rotation.y = Math.sin(t * 2) * 0.2;

    lexi.position.y = Math.cos(t * 4) * 0.15;
    lexi.rotation.y = -Math.sin(t * 2) * 0.2;

    brad.rotation.y = t * 0.5;

    camera.position.x = Math.sin(t * 0.5) * 3;
    camera.position.z = 10 + Math.cos(t * 0.5) * 2;
    camera.lookAt(0, 1.5, 0);

    const captionBox = document.getElementById('caption');
    if (t > 15.0) {
      captionBox.textContent = "💥 BAM! 3D CELL-SHADED ACTION! 💥";
    } else if (t > 7.0) {
      captionBox.textContent = "BRAD BROUGHT HIS LEGENDARY BIG ENERGY!";
    }
  }

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
