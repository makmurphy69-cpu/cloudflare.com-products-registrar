<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#081826"><script src="/sw-register.js" defer></script><script src="usage-counter.js" defer></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Convert Forge — video to GIF, MP3 and compressed MP4</title><meta name="description" content="Convert video to GIF or MP3 and compress video locally in your browser."><link rel="stylesheet" href="local-tools.css"><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script><link rel="stylesheet" href="tutorials.css">
</head><body><nav class="tool-nav"><a href="index.html">← All tools</a><span>Media Convert Forge</span></nav><header class="masthead"><div><h1>Media Convert Forge</h1><p>Turn video into GIF or MP3 and reduce MP4 size.</p></div></header><main><section class="panel"><p class="privacy">🔒 Processing happens locally. The converter downloads its engine on first use; large videos may be slow on phones.</p><div class="field"><label for="file">Video or audio file</label><input id="file" type="file" accept="video/*,audio/*"></div><div class="grid"><div class="field"><label for="mode">Output</label><select id="mode"><option value="gif">Animated GIF</option><option value="mp3">MP3 audio</option><option value="compress">Compressed MP4</option></select></div><div class="field"><label for="seconds">GIF length (seconds)</label><input id="seconds" type="number" min="1" max="20" value="8"></div></div><div class="actions"><button class="primary" id="convert">Convert and download</button></div><div class="status" id="status"></div></section></main><footer>Part of <a href="index.html">MigaBuilder</a>.</footer><script>
const $=id=>document.getElementById(id);function note(s){$('status').textContent=s;$('status').classList.add('show')}let ffmpeg;async function run(){const f=$('file').files[0];if(!f)return note('Choose a file first.');if(!window.FFmpeg)return note('The conversion engine could not load. Check your connection and try again.');try{$('convert').disabled=true;note('Loading the local conversion engine…');if(!ffmpeg){ffmpeg=FFmpeg.createFFmpeg({log:false});await ffmpeg.load()}const ext=(f.name.split('.').pop()||'mp4').replace(/[^a-z0-9]/gi,'');const input='input.'+ext;ffmpeg.FS('writeFile',input,await FFmpeg.fetchFile(f));const mode=$('mode').value;let out,args,type;if(mode==='gif'){out='migabuilder.gif';args=['-i',input,'-t',String(Math.min(20,Math.max(1,+$('seconds').value||8))),'-vf','fps=10,scale=640:-1:flags=lanczos',out];type='image/gif'}else if(mode==='mp3'){out='migabuilder.mp3';args=['-i',input,'-vn','-b:a','192k',out];type='audio/mpeg'}else{out='migabuilder-compressed.mp4';args=['-i',input,'-c:v','libx264','-crf','30','-preset','veryfast','-c:a','aac','-b:a','128k',out];type='video/mp4'}note('Converting locally… keep this tab open.');await ffmpeg.run(...args);const data=ffmpeg.FS('readFile',out),u=URL.createObjectURL(new Blob([data.buffer],{type})),a=document.createElement('a');a.href=u;a.download=out;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);note('Finished and downloaded.')}catch(e){note('Could not convert this file: '+e.message)}finally{$('convert').disabled=false}}$('convert').onclick=run;
</script><script src="tutorials.js" defer></script>
</body></html>
