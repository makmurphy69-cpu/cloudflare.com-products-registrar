name: AI Repository Manager

on:
  repository_dispatch:
    types: [manage_files]

jobs:
  commit_changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTO_GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "AI Automated Manager"
          git config --global user.email "ai-manager@users.noreply.github.com"

      - name: Commit and Push Changes
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "${{ github.event.client_payload.commit_message }}"
            git push origin ${{ github.event.client_payload.branch }}
          else
            echo "No changes to commit"
          fi
